name: Sync series (dagligt)

# Det inkrementelle hentejob til den nye model, series og observations.
#
# Kører hver dag kl. 05:30 UTC. Renter, valuta og elpris får nye tal
# hver hverdag; månedsserierne tjekkes samtidig, så vi slipper for at
# vedligeholde en publiceringskalender.
#
# Vercel-cronen kl. 06:00 udløser den samme kørsel som reserve; den
# hurtigste af de to sætter tempoet. Vercel skriver intet selv.
#
# Alle elleve kilder i den gamle model (DataPoint) hentes også her,
# før broen løfter dem over i observations. Der er ikke længere noget
# månedligt job: sync-dst.yml blev fjernet 20. oktober 2026, så hver
# kilde opdateres dagen efter DST publicerer, ikke den 25.
#
# Nødvendige hemmeligheder:
#   DATABASE_URL   Neon connection string
#   ADMIN_SECRET   så jobbet kan bede /pulse om at genskabe sig med det
#                  samme. Uden den opdaterer siden sig alligevel, men
#                  først når ISR-vinduet på en time udløber. Jobbet
#                  siger det højt i loggen hvis den mangler.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      udloeser:
        description: "Hvem startede den. Vercel-cronen saetter vercel."
        type: string
        default: "manuel"
      tving:
        description: "Koer selvom en anden koersel lige har vaeret der."
        type: boolean
        default: false
      dry_run:
        description: "Tørløb — hent fra kilderne, skriv intet"
        type: boolean
        default: false
      series:
        description: "Kun disse serie-id'er, mellemrumsadskilt. Tomt betyder alle."
        type: string
        default: ""

# To uafhaengige udloesere peger paa den her koersel: GitHubs egen
# scheduler og Vercels cron gennem /api/cron/pulse. Gruppen sikrer at to
# der starter i samme oejeblik koer op i stedet for at koere oven i
# hinanden. cancel-in-progress er FALSE: en halvfaerdig hentning skal
# have lov at blive faerdig, ikke droeftes af en dublet.
# Vaernet i skal-koere.ts skal kunne laese workflowets egne koersler.
permissions:
  actions: read
  contents: read

concurrency:
  group: sync-series
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    name: Inkrementel hentning
    runs-on: ubuntu-latest
    # Et fuldt løb tog 30 sekunder målt 28. juli 2026, og de ni gamle
    # kilder lagde omkring et minut til i oktober. Tredive minutter er
    # rigeligt til at en kilde kan være langsom uden at jobbet hænger
    # i timevis.
    timeout-minutes: 30

    steps:
      - name: Hvem startede koerslen
        # Staar foerst i loggen, saa det kan aflaeses bagefter om
        # GitHubs scheduler eller Vercel-cronen fyrede.
        run: echo "udloeser=${{ github.event_name == 'schedule' && 'github-schedule' || inputs.udloeser }}"

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Installér afhængigheder
        run: npm ci

      - name: Generér Prisma-klient
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Er arbejdet lige gjort
        # Værnet ligger HER, hvor de to udløsere mødes. Ruten i
        # /api/cron/pulse stopper Vercel fra at udløse en dublet, men
        # den kan ikke stoppe GitHubs egen scheduler, som fyrer
        # ubetinget. Uden det her kørte jobbet to gange i døgnet.
        id: vaern
        run: npx tsx scripts/skal-koere.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TVING: ${{ inputs.tving }}

      - name: Kør testene først
        id: test
        if: steps.vaern.outputs.skal == 'true'
        # En hentning der skriver i produktion skal ikke køre fra en
        # commit hvor værnene er i stykker.
        run: npm test

      - name: Væk basen
        id: basen
        if: steps.test.outcome == 'success'
        # Neon sover efter fem minutters stilhed, og det første kald efter
        # en opvågning kan fejle. Den 15. oktober 2026 ramte det AUS08.
        # Her rides opvågningen af med genforsøg, før noget skrives.
        run: npx tsx scripts/vaek-basen.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Trinene herfra kører hver for sig, ikke i kæde. En kilde der
      # fejler (DST lukker af og til forbindelsen) må ikke tage de andre
      # med sig, men jobbet ender stadig som fejlet, så det kan ses.
      # Betingelsen er derfor !cancelled() plus at basen svarede,
      # ikke den implicitte success() der kræver at ALT foer lykkedes.

      - name: AUS08 til den gamle model (ledighed)
        id: aus08
        if: ${{ !cancelled() && steps.basen.outcome == 'success' && inputs.dry_run != true && inputs.series == '' }}
        run: npx tsx scripts/sync-aus08.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Signaler for ledighed
        if: ${{ !cancelled() && steps.aus08.outcome == 'success' }}
        run: npx tsx scripts/generate-signals.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: KONK3 til den gamle model (konkurser)
        id: konk3
        if: ${{ !cancelled() && steps.basen.outcome == 'success' && inputs.dry_run != true && inputs.series == '' }}
        run: npx tsx scripts/sync-konk3.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Signaler for konkurser
        if: ${{ !cancelled() && steps.konk3.outcome == 'success' }}
        run: npx tsx scripts/generate-konkurs-signals.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # De oevrige ni kilder i den gamle model. Indtil 20. oktober 2026
      # hentede et maanedligt job (sync-dst.yml) dem den 25., uanset
      # hvornaar DST publicerede. September-tallene for forbrugerpriserne
      # kom hos DST 12. oktober og ville foerst have naaet siden den 25.,
      # mens undergrupperne fra samme tabel allerede stod der via den nye
      # model. Nu hentes de dagligt. Scripterne skriver kun aendringer.
      # KONK4 blev lukket af DST 7. januar 2026 og er afloest af KONK25.

      - name: FOLK1AM til den gamle model (befolkning)
        id: folk1am
        if: ${{ !cancelled() && steps.basen.outcome == 'success' && inputs.dry_run != true && inputs.series == '' }}
        run: npx tsx scripts/sync-folk1am.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: KONK25 til den gamle model (konkurser efter branche)
        id: konk25
        if: ${{ !cancelled() && steps.basen.outcome == 'success' && inputs.dry_run != true && inputs.series == '' }}
        run: npx tsx scripts/sync-konk25.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: FORV1 til den gamle model (forbrugertillid)
        id: forv1
        if: ${{ !cancelled() && steps.basen.outcome == 'success' && inputs.dry_run != true && inputs.series == '' }}
        run: npx tsx scripts/sync-forv1.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Signaler for forbrugertillid
        if: ${{ !cancelled() && steps.forv1.outcome == 'success' }}
        run: npx tsx scripts/generate-forv1-signals.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: DETA211A til den gamle model (detailomsaetning)
        id: deta211a
        if: ${{ !cancelled() && steps.basen.outcome == 'success' && inputs.dry_run != true && inputs.series == '' }}
        run: npx tsx scripts/sync-deta211a.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: PRIS01 til den gamle model (forbrugerpriser)
        id: pris01
        if: ${{ !cancelled() && steps.basen.outcome == 'success' && inputs.dry_run != true && inputs.series == '' }}
        run: npx tsx scripts/sync-pris01.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: BYGV33 til den gamle model (nyopstartede boliger)
        id: bygv33
        if: ${{ !cancelled() && steps.basen.outcome == 'success' && inputs.dry_run != true && inputs.series == '' }}
        run: npx tsx scripts/sync-bygv33.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Signaler for boligbyggeri
        if: ${{ !cancelled() && steps.bygv33.outcome == 'success' }}
        run: npx tsx scripts/generate-bygv33-signals.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: INDKP101 til den gamle model (disponibel indkomst)
        id: indkp101
        if: ${{ !cancelled() && steps.basen.outcome == 'success' && inputs.dry_run != true && inputs.series == '' }}
        run: npx tsx scripts/sync-indkp101.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: EJDFOE1 til den gamle model (ejendomsvaerdier)
        id: ejdfoe1
        if: ${{ !cancelled() && steps.basen.outcome == 'success' && inputs.dry_run != true && inputs.series == '' }}
        run: npx tsx scripts/sync-ejdfoe1.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: LABY01 til den gamle model (befolkningstilvaekst)
        id: laby01
        if: ${{ !cancelled() && steps.basen.outcome == 'success' && inputs.dry_run != true && inputs.series == '' }}
        run: npx tsx scripts/sync-laby01.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Signaler for befolkningstilvaekst
        if: ${{ !cancelled() && steps.laby01.outcome == 'success' }}
        run: npx tsx scripts/generate-laby01-signals.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Bro fra den gamle model
        if: ${{ !cancelled() && steps.basen.outcome == 'success' }}
        # Ni serier fodres stadig af de gamle sync-scripts, som skriver
        # til DataPoint. Broen loefter dem over i observations, saa
        # dashboardene ikke fryser den dag DST publicerer. Koerer efter
        # AUS08 og KONK3, saa dagens tal kommer med i samme omgang.
        run: |
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry"; fi
          npx tsx scripts/sync-legacy-bridge.ts $args
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Afledte serier
        if: ${{ !cancelled() && steps.basen.outcome == 'success' }}
        # Mængdeindekset for detailhandlen er omsætning divideret med
        # forbrugerpriser. Begge kilder kommer gennem broen lige ovenfor,
        # så den afledte serie regnes efter dem og før siderne genskabes
        # til sidst i hentningen. Den stod stille på april 2026, fordi
        # intet workflow kørte den. Scriptet kaster før skrivning, hvis
        # resultatet har forkert størrelsesorden.
        run: |
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry"; fi
          npx tsx scripts/build-derived.ts $args
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Haandhaev korrelationsgrupperne
        if: ${{ !cancelled() && steps.basen.outcome == 'success' }}
        # Koeres FOER hentningen, saa genskabelsen af /pulse til sidst
        # sker efter en eventuel aendring. Scriptet er idempotent og
        # fejler hvis en gruppe ender med to rangerbare, saa reglen
        # haandhaeves dagligt i stedet for naar nogen husker det.
        run: |
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry"; fi
          npx tsx scripts/set-rank-groups.ts $args
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Hent nye observationer
        if: ${{ !cancelled() && steps.basen.outcome == 'success' }}
        # Inputtene gaar gennem env og ikke ind i kommandolinjen direkte.
        # ${{ }} interpoleres af GitHub FOER shellen ser linjen, saa et
        # serie-id med semikolon i ville blive koert som en kommando.
        run: |
          args=""
          if [ "$DRY_RUN" = "true" ]; then args="--dry"; fi
          npx tsx scripts/sync-series.ts $args $SERIES_IDS
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SERIES_IDS: ${{ inputs.series }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          SITE_URL: https://alius.dk
