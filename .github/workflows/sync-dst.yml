name: Sync DST data

# Runs on the 25th of every month at 06:00 UTC.
# DST publishes monthly stats around the 15th–20th, so the 25th catches
# all monthly updates with a few days' buffer.
#
# Required secret: DATABASE_URL (Neon connection string)
# Set it at: Settings → Secrets and variables → Actions → New repository secret

on:
  schedule:
    - cron: "0 6 25 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — print which scripts would run without executing"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    name: Sync all DST sources
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        id: setup
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Monthly sources ────────────────────────────────────────────

      # AUS08 og KONK3 hentes DAGLIGT i sync-series.yml, sammen med deres
      # signaler. De stod her og i Vercel-cronen indtil 9. oktober 2026.

      - name: FOLK1AM — Befolkning
        if: ${{ always() && steps.setup.outcome == 'success' && inputs.dry_run != true }}
        run: npx tsx scripts/sync-folk1am.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # KONK4 blev lukket af DST 7. januar 2026 (active: false, sidste
      # periode 2025M12). Afløst af KONK25 med DB25-brancher.
      - name: KONK25 — Konkurser (branche)
        if: ${{ always() && steps.setup.outcome == 'success' && inputs.dry_run != true }}
        run: npx tsx scripts/sync-konk25.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: FORV1 — Forbrugerforventninger
        if: ${{ always() && steps.setup.outcome == 'success' && inputs.dry_run != true }}
        run: npx tsx scripts/sync-forv1.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: DETA211A — Detailomsætning
        if: ${{ always() && steps.setup.outcome == 'success' && inputs.dry_run != true }}
        run: npx tsx scripts/sync-deta211a.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: PRIS01 — Forbrugerprisindeks
        if: ${{ always() && steps.setup.outcome == 'success' && inputs.dry_run != true }}
        run: npx tsx scripts/sync-pris01.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Quarterly sources ──────────────────────────────────────────

      - name: BYGV33 — Nyopstartede boliger
        if: ${{ always() && steps.setup.outcome == 'success' && inputs.dry_run != true }}
        run: npx tsx scripts/sync-bygv33.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Yearly sources ─────────────────────────────────────────────

      - name: INDKP101 — Disponibel indkomst
        if: ${{ always() && steps.setup.outcome == 'success' && inputs.dry_run != true }}
        run: npx tsx scripts/sync-indkp101.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: EJDFOE1 — Ejendomsværdier
        if: ${{ always() && steps.setup.outcome == 'success' && inputs.dry_run != true }}
        run: npx tsx scripts/sync-ejdfoe1.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: LABY01 — Befolkningstilvækst
        if: ${{ always() && steps.setup.outcome == 'success' && inputs.dry_run != true }}
        run: npx tsx scripts/sync-laby01.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Signal generation (runs after all data syncs) ──────────────

      - name: Generer signaler — forbrugertillid
        if: ${{ always() && steps.setup.outcome == 'success' && inputs.dry_run != true }}
        run: npx tsx scripts/generate-forv1-signals.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generer signaler — boligbyggeri
        if: ${{ always() && steps.setup.outcome == 'success' && inputs.dry_run != true }}
        run: npx tsx scripts/generate-bygv33-signals.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Generer signaler — befolkningstilvækst
        if: ${{ always() && steps.setup.outcome == 'success' && inputs.dry_run != true }}
        run: npx tsx scripts/generate-laby01-signals.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Dry run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Scripts der ville køre:"
          ls scripts/sync-*.ts scripts/generate-*.ts
